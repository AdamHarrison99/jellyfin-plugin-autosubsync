name: "AutoSubSync"
guid: "6dbc32c5-1c68-481e-b066-9521552a2615"
version: "1.4.2.0"
targetAbi: "10.11.0.0"
framework: "net9.0"
overview: "Automatically synchronizes external and embedded subtitles across your library."
description: |
  Finds out-of-sync subtitles across your movie and TV libraries and realigns them against
  the audio of the media they belong to, using a pinned build of the AutoSubSync CLI
  (assy-cli) that is downloaded once on first use and verified against a checksum built
  into the plugin. Handles both external subtitle files and embedded subtitle tracks, which
  are extracted, synchronized, and written back alongside the media. Original media files
  are never modified. Includes dry run mode, per-library scoping, language filtering,
  backups, and full rollback.
category: "General"
owner: "AdamHarrison99"
artifacts:
  - "Jellyfin.Plugin.AutoSubSync.dll"
changelog: |
  - Removed duplicates are counted in the pipeline table instead of disappearing from it
  - Image tracks skipped because a text subtitle covers them are listed as unsupported
    instead of going unreported
  - The audio check column no longer appears on pipeline steps it does not run
  - Subtitles awaiting a dry run are no longer counted as already in sync
  - The median shift is reported as a distance, and negative shifts display correctly
  - Reason lists are no longer cut off after eight entries
  - The panel shows when its counts were last updated
