name: "AutoSubSync"
guid: "6dbc32c5-1c68-481e-b066-9521552a2615"
version: "1.6.3.0"
targetAbi: "10.11.0.0"
framework: "net9.0"
overview: "Automatically synchronizes external and embedded subtitles across your library, and can download one where a wanted language has none."
description: |
  Finds out-of-sync subtitles across your movie and TV libraries and realigns them against
  the audio of the media they belong to, using a pinned build of the AutoSubSync CLI
  (assy-cli) that is downloaded once on first use and verified against a checksum built
  into the plugin. Handles both external subtitle files and embedded subtitle tracks, which
  are extracted, synchronized, and written back alongside the media. Original media files
  are never modified. Where a wanted language has no subtitle at all, it can download one
  through the subtitle provider plugins you already have installed, and keeps it only when
  the audio check confirms it against the video. Includes dry run mode, per-library scoping,
  language filtering, backups, and full rollback.
category: "General"
owner: "AdamHarrison99"
artifacts:
  - "Jellyfin.Plugin.AutoSubSync.dll"
changelog: |
  - The result shown for an item is final for that scan; items no longer move between
    the status panel's groups while a scan is running
  - An item that reaches its per-item download limit is set aside rather than reported
    as a failure, and is picked up again once its limits are fresh
  - A new setting decides how long an item that came away with nothing is left alone
    before the providers are asked again; seven days by default, zero waits not at all
  - The per-item download limit is counted over that same window instead of for ever,
    and a file an item has already downloaded is never downloaded twice
  - Retry failed subtitles also releases an item waiting out that window
  - A rejection the audio check reached no verdict on now names the language searched
  - A subtitle that could not be downloaded at all is worded apart from one the audio
    check refused, so one sentence no longer appears under two headings
  - Status tiles no longer break their labels mid-word or run outside their box
